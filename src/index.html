<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PuTTY Launcher</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app">
      <!-- div class="app-header">
        <div>
          <h2>Saved PuTTY Sessions</h2>
          <p class="subtle">Browse categories on the left and inspect sessions on the right.</p>
        </div>
      </div -->

      <div class="explorer-layout">
        <aside id="treePanel">
          <div class="panel-title">Session Categories</div>
          <ul id="sessionsList" class="tree-view"></ul>
        </aside>
        <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
        <main id="detailsPanel">
          <div class="panel-title">Details</div>
          <div id="detailsContent" class="details-content">
            <p class="detail-empty">Select a category or session to view subitems and properties.</p>
          </div>
        </main>
      </div>
      <!-- p class="footer-note">Note: installer support added; build with <code>npm run dist</code>.</p -->
      <div id="statusBar" class="status-bar" aria-live="polite"></div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
